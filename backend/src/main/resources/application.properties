# ==========================================================
# SMART ATTENDANCE SYSTEM - BACKEND CONFIGURATION
# ==========================================================

spring.application.name=backend

# ==========================================================
# SERVER CONFIGURATION
# ==========================================================

server.port=8080

# ==========================================================
# DATABASE CONFIGURATION - MYSQL SERVER
# ==========================================================

# Database: attendance_system
# MySQL Server default port: 3306
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_system

# MySQL Server username
spring.datasource.username=root

# MySQL Server password
# Yahan MySQL install karte waqt set kiya hua root password dalo
spring.datasource.password=Sambit@2005

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ==========================================================
# JWT CONFIGURATION
# ==========================================================

jwt.secret=${JWT_SECRET:c21hcnQtYXR0ZW5kYW5jZS1qd3Qtc2VjcmV0LWtleS0yMDI2IQ==}

# 30 Days
jwt.expiration=2592000000

# ==========================================================
# LOGIN / LOGOUT SECURITY
# ==========================================================

# 5 Minutes
auth.login-cooldown=300000